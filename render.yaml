# Free compute is for initial testing, not a production reliability promise.
services:
  - type: web
    name: bill-reminder-mail-test
    runtime: node
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@11.25.0 --activate && pnpm install --frozen-lockfile --prod --ignore-scripts
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MAILBOX_IMPORT_ENABLED
        value: "true"
